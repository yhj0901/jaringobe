# 배포/이관 서버 전용 compose — 어떤 호스트(VPS·사내 서버·클라우드 VM)로 옮겨도 동일하게 동작한다.
#
# 사용:
#   1) 저장소 클론 후 루트에 .env 생성 (.env.example 참고 — 커밋 금지)
#   2) docker compose -f docker/docker-compose.server.yml --env-file .env up -d --build
#   3) 마이그레이션은 backend 컨테이너 entrypoint 가 자동 실행 (alembic upgrade head)
#
# 특징: db 는 공인망 미노출(127.0.0.1 바인딩), caddy 가 유일한 외부 진입점.
name: jaringobe

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    # 공인망 미공개 — 서버 localhost 에만 바인딩 (팀원은 SSH 터널로 접속: -L 15432:localhost:5432)
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # entrypoint 가 기동 시 alembic upgrade head 실행 (false 로 끄고 수동 운용 가능)
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      JWT_SECRET: ${JWT_SECRET:?}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
    # 공인망 직접 노출 없음 — caddy 가 유일한 진입점. 서버 내 디버깅용 localhost 만 바인딩
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      # 도메인 미지정 시 Caddyfile 기본값 :80 (HTTP)
      API_DOMAIN: ${API_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
